# Full signed + notarized macOS build on free public-repo minutes. Mirrors the
# private build except that it does not publish a GitHub Release.
#
# The notarize step's `if: startsWith(github.ref, 'refs/tags/desktop-v')` gate
# is removed on purpose: this workflow is dispatch-only, so the gate would be
# false every run and the step would silently skip.
name: Build macOS (signed + notarized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    # 10x billing multiplier. Build is ~1h; cap well above that but far
    # below GitHub's 6h default, which would cost 3600 billed minutes.
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    # Code signing. electron-builder reads CSC_LINK (base64 .p12) and
    # CSC_KEY_PASSWORD automatically — no build config needed. It signs every
    # nested Mach-O inside out, which is required: Apple rejects notarization
    # if any binary in the bundle is unsigned, and R ships hundreds of .so
    # files. Do NOT add `signIgnore` patterns without verifying them against a
    # real Mach-O inventory — electron-builder matches them with an unanchored
    # RegExp.test(), so a pattern like ".../R(/.*)?" also matches Rcpp.so.
    #
    # Notarization is NOT done by electron-builder (package.json keeps
    # "notarize": false). We submit the finished DMG to notarytool below —
    # a single-file upload, which avoids a known @electron/notarize hang when
    # waiting on .app submissions.
    #
    # CSC_LINK is deliberately absent: when electron-builder sees it, it
    # provisions its own keychain, which fails on the macos-26 image. We import
    # the cert below and point it at the result via CSC_KEYCHAIN / CSC_NAME.
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lifted from smoke-test-mac-signing.yml, which passes on this image.
      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        # `set -euo pipefail` without -x: tracing would leak the cert password.
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then echo "::error::CSC_LINK is not set"; exit 1; fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          umask 077
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign prompts for keychain access and hangs in CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "--- available signing identities ---"
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found."
            exit 1
          fi

          # CSC_NAME must NOT carry the "Developer ID Application:" prefix -
          # electron-builder picks the certificate type itself and rejects it.
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CSC_NAME=${IDENTITY#Developer ID Application: }" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

      # The DMG step mounts a temporary volume and copies the entire .app into
      # it, so it needs roughly TWICE the bundle size free. A bundled R runtime
      # with 355 packages makes that several GB, and the arm64 runner does not
      # have it spare: the build signs successfully and then dies with
      # "No space left on device" while running dmgbuild.
      #
      # Keep the ACTIVE Xcode: codesign, notarytool and stapler all come from
      # it. Only the unused versions and simulator runtimes are removed.
      #
      # The space check below is advisory only: warn now rather than leaving a
      # later "No space left on device" to be diagnosed from a stack trace.
      # With the two-phase build, peak usage is roughly 8.5 GB (staging is
      # reclaimed before the DMG volume is mounted), so 10 GB is the point
      # worth flagging. A bare `df -g` parse can yield a non-integer on
      # unexpected output, so only compare when it actually looks like a
      # number.
      - name: Free disk space
        run: |
          set -uo pipefail
          echo "--- before ---"
          df -h /
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          ACTIVE_XCODE="$(xcode-select -p | sed 's|/Contents/Developer.*||')"
          echo "keeping active Xcode: $ACTIVE_XCODE"
          for x in /Applications/Xcode_*.app; do
            [ -e "$x" ] || continue
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              echo "removing $x"
              sudo rm -rf "$x" || true
            fi
          done
          echo "--- after ---"
          df -h /
          AVAIL_GB=$(df -g / | awk 'NR==2 {print $4}')
          echo "Available: ${AVAIL_GB}G"
          case "$AVAIL_GB" in
            ''|*[!0-9]*)
              echo "::warning::Could not parse available space from df" ;;
            *)
              if [ "$AVAIL_GB" -lt 10 ]; then
                echo "::warning::Only ${AVAIL_GB}G free. The DMG step needs roughly 2x the bundle size; consider pruning the R library further."
              fi ;;
          esac

      - name: Set package directory
        run: echo "PACKAGE_DIR=electron" >> "$GITHUB_ENV"

      # The R package name encodes the release version and changes on every
      # release: idepGolem -> idep250 -> idep251 -> idep300. R resolves
      # system.file(package=) and packageVersion() against the INSTALLED name,
      # so nothing on the desktop side may hardcode it. DESCRIPTION is the only
      # source of truth; PKG_NAME is threaded through the build, the test,
      # the bundle, and on to bootstrap.R at runtime via IDEP_APP_PKG.
      - name: Detect R package source and name
        run: |
          set -euo pipefail
          if [ ! -f DESCRIPTION ]; then
            echo "No DESCRIPTION at the repository root" >&2
            exit 1
          fi
          PKG_SRC="."
          PKG_NAME=$(awk '/^Package:/ {print $2; exit}' DESCRIPTION)
          if [ -z "$PKG_NAME" ]; then
            echo "Could not parse the Package field in ./DESCRIPTION" >&2
            exit 1
          fi
          echo "PKG_SRC=$PKG_SRC" >> "$GITHUB_ENV"
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_SRC  = $PKG_SRC"
          echo "PKG_NAME = $PKG_NAME"
          grep -E "^(Package|Version):" DESCRIPTION

      - name: Fix invalid filename in R/ (leading underscore)
        run: |
          set -euo pipefail
          bad="$PKG_SRC/R/_disable_autoload.R"
          if [ -f "$bad" ]; then
            mv "$bad" "$PKG_SRC/R/z_disable_autoload.R"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.PACKAGE_DIR }}/package-lock.json

      - name: Install npm deps
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euxo pipefail
          if [ -f package-lock.json ]; then
            npm ci || (rm -rf node_modules && npm install --no-fund --no-audit)
          else
            npm install --no-fund --no-audit
          fi

      - name: Ensure electron-builder present
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euxo pipefail
          if ! npx --yes --package=electron-builder@26.8.2 --call "echo ok" >/dev/null 2>&1; then
            npm install -D electron-builder@26.8.2
          fi


      # Write OAuth config from GitHub Actions secrets so it ships in the installer.
      - name: Write electron/.env from secrets
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          cat > .env <<EOF
          GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ENTITLEMENT_URL=${{ secrets.ENTITLEMENT_URL }}
          CHECKOUT_URL=${{ secrets.CHECKOUT_URL }}
          PORTAL_URL=${{ secrets.PORTAL_URL }}
          EOF

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      # Apple Clang does not ship OpenMP headers or runtime.  Some native
      # packages (e.g. runibic, QUBIC) hard-require <omp.h> and will fail
      # without libomp.  Linux ships libgomp with GCC and Windows ships
      # it in Rtools' MinGW, so this step is Mac-only.
      #
      # Why the full path to libomp.dylib instead of -L + -lomp:
      # R's default link line uses `-undefined dynamic_lookup`.  With
      # Xcode 15+'s linker, that causes `-lomp` to be silently dropped
      # from the resulting .so's LC_LOAD_DYLIB list when the OpenMP
      # symbols are treated as "resolve at runtime via flat namespace".
      # dlopen then can't find the OpenMP runtime and the package fails
      # to load.  Passing the full path as a positional arg forces the
      # linker to always record the dylib dependency.
      - name: Install OpenMP (libomp) for native R packages
        run: |
          set -euxo pipefail
          brew install libomp
          OMP_PREFIX="$(brew --prefix libomp)"
          OMP_DYLIB="${OMP_PREFIX}/lib/libomp.dylib"
          echo "libomp install_name:"
          otool -D "$OMP_DYLIB"
          mkdir -p "$HOME/.R"
          cat >> "$HOME/.R/Makevars" <<EOF
          CPPFLAGS += -Xclang -fopenmp -I${OMP_PREFIX}/include
          LDFLAGS  += ${OMP_DYLIB}
          EOF
          echo "---- ~/.R/Makevars ----"
          cat "$HOME/.R/Makevars"

      # Mirror R.home() into runtime/R.framework/Resources, then patch
      # hardcoded /Library/Frameworks paths in bin/R so the runtime is
      # relocatable inside the .app bundle.
      - name: Stage R.framework (mirror R.home + patch for relocation)
        run: |
          set -euo pipefail
          RHOME=$(Rscript -e "cat(R.home())")
          if [ -z "$RHOME" ]; then
            echo "Could not get R.home()" >&2
            exit 1
          fi

          dst_root="${PACKAGE_DIR}/runtime/R.framework"
          dst="${dst_root}/Resources"

          mkdir -p "$dst"
          rsync -a "${RHOME}/" "${dst}/"

          echo "RHOME         = $RHOME"
          echo "Bundled ROOT  = $dst_root"
          echo "Bundled RHOME = $dst"

          if [ -f "${dst}/bin/Rscript" ]; then
            chmod +x "${dst}/bin/Rscript"
          fi

          # Patch hardcoded R_HOME_DIR in bin/R so the runtime is portable.
          bash electron/scripts/patch_r_mac.sh "$dst"

      - name: Resolve bundled paths (debug)
        run: |
          set -euo pipefail
          app="$PACKAGE_DIR"
          rscript="$app/runtime/R.framework/Resources/bin/Rscript"
          lib="$app/runtime/R.framework/Resources/library"
          echo "APP:      $app"
          echo "Rscript:  $rscript"
          echo "LIB PATH: $lib"
          if [ ! -x "$rscript" ]; then
            echo "Bundled Rscript not found or not executable: $rscript" >&2
            ls -R "$app/runtime" || true
            exit 1
          fi
          mkdir -p "$lib"

      # rmarkdown shells out to the pandoc binary; it's not an R package, so
      # install_packages.R can't fetch it. Ship the official portable build.
      # See main.js getRuntime() for the matching PATH/RSTUDIO_PANDOC wiring.
      # macos-latest runners are arm64; match get_r_mac.sh's arch mapping.
      - name: Stage pandoc
        env:
          PANDOC_VERSION: "3.11"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) ARCH="x86_64" ;;
            *)            ARCH="arm64" ;;
          esac
          dest="$PACKAGE_DIR/runtime/pandoc.mac"
          tmp="$(mktemp -d)"
          curl -fL --retry 3 -o "$tmp/pandoc.zip" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-${ARCH}-macOS.zip"
          ditto -x -k "$tmp/pandoc.zip" "$tmp/extracted"
          mkdir -p "$dest"
          cp "$tmp/extracted/pandoc-${PANDOC_VERSION}-${ARCH}/bin/pandoc" "$dest/pandoc"
          chmod +x "$dest/pandoc"
          echo "pandoc ${PANDOC_VERSION} ready at: $dest/pandoc"

      # Restores the ~355 installed R packages so they are not recompiled on
      # every run. The restore-keys fallback keys on install_packages.R alone,
      # so bumping DESCRIPTION's Version: still reuses the previous library and
      # pak installs only what genuinely changed. Changing install_packages.R
      # (a PPM snapshot bump) deliberately misses everything and reinstalls
      # clean -- matching a fallback there would ship the old pinned versions.
      - name: Cache bundled R library
        id: r-lib-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PACKAGE_DIR }}/runtime/R.framework/Resources/library
          key: rlib-macos-arm64-R4.5.1-${{ env.ImageOS }}-${{ runner.arch }}-${{ hashFiles('electron/scripts/install_packages.R') }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            rlib-macos-arm64-R4.5.1-${{ env.ImageOS }}-${{ runner.arch }}-${{ hashFiles('electron/scripts/install_packages.R') }}-

      # Shared across all three platforms.  Reads Imports + Remotes from
      # DESCRIPTION, installs via PPM-pinned CRAN + Bioc snapshots using
      # pak::local_install_deps().  Do not duplicate logic here.
      - name: Install R packages via PPM snapshot
        if: steps.r-lib-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rscript="$PACKAGE_DIR/runtime/R.framework/Resources/bin/Rscript"
          lib="$PACKAGE_DIR/runtime/R.framework/Resources/library"
          "$rscript" --no-save --no-restore electron/scripts/install_packages.R "$lib"

      # Saved BEFORE the app package is installed, so the cache holds exactly the
      # ~355 dependencies and never a stale idep<version>/ from an earlier
      # release -- both installs write into the same library/ dir. Explicit save
      # rather than the post-job one, which on macOS would find nothing: the
      # "Reclaim staging space" step deletes runtime/ before the job ends.
      - name: Save bundled R library cache
        if: steps.r-lib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PACKAGE_DIR }}/runtime/R.framework/Resources/library
          key: ${{ steps.r-lib-cache.outputs.cache-primary-key }}

      - name: Build and install the R package into R.framework/Resources/library
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
          R_BUILD_DONTFAIL_ON_WARNING_: "true"
          R_BUILD_TAR: tar
          TAR: tar
        run: |
          set -euo pipefail
          app="$PACKAGE_DIR"
          lib="$app/runtime/R.framework/Resources/library"
          Rexe="$app/runtime/R.framework/Resources/bin/R"
          libR="$lib"

          pushd "$PKG_SRC"
          "$Rexe" CMD build . --no-build-vignettes --no-manual
          tarball=$(ls -1t *.tar.gz | head -n1 || true)
          popd
          if [ -z "$tarball" ]; then
            echo "Package tarball not found after build" >&2
            exit 1
          fi
          export R_LIBS="$libR"
          export R_LIBS_USER="$libR"
          "$Rexe" CMD INSTALL --library="$lib" "$PKG_SRC/$tarball"

      - name: Stage app sources into electron/app
        run: |
          set -euo pipefail
          app="$PACKAGE_DIR"
          rm -rf "$app/app"
          mkdir -p "$app/app"
          cp -r "$PKG_SRC/R"        "$app/app/R"
          cp    "$PKG_SRC/app.R"    "$app/app/app.R"
          cp    "$PKG_SRC/DESCRIPTION" "$app/app/DESCRIPTION"

      - name: Verify required pkgs in bundled lib
        run: |
          set -euo pipefail
          r="$PACKAGE_DIR/runtime/R.framework/Resources/bin/Rscript"
          libR="$PACKAGE_DIR/runtime/R.framework/Resources/library"
          "$r" -e "lp <- '$libR'; cat('hgu133plus2.db:', 'hgu133plus2.db' %in% rownames(installed.packages(lib.loc=lp)), '\n')"

      # Bundle Homebrew's libomp into the R.framework so the .app works
      # on user Macs that don't have Homebrew installed.  Every .so we
      # built from source has LC_LOAD_DYLIB pointing at
      # /opt/homebrew/opt/libomp/lib/libomp.dylib, which won't exist on
      # end-user machines.  We copy libomp into R.framework/Resources/lib,
      # rewrite its own install_name to @rpath/libomp.dylib, then patch
      # every package .so that references the Homebrew path to use
      # @rpath instead, with an LC_RPATH that resolves to the bundled
      # lib dir.  electron-builder re-signs .so files ad-hoc after this,
      # so invalidated signatures aren't a problem.
      - name: Bundle libomp and relocate install_names
        run: |
          set -euxo pipefail
          R_LIB="$PACKAGE_DIR/runtime/R.framework/Resources/library"
          R_LIBDIR="$PACKAGE_DIR/runtime/R.framework/Resources/lib"
          OMP_DYLIB="$(brew --prefix libomp)/lib/libomp.dylib"

          mkdir -p "$R_LIBDIR"
          cp -f "$OMP_DYLIB" "$R_LIBDIR/libomp.dylib"
          chmod u+w "$R_LIBDIR/libomp.dylib"
          install_name_tool -id "@rpath/libomp.dylib" "$R_LIBDIR/libomp.dylib"

          # Path baked into every .so that linked the Homebrew libomp.
          HOMEBREW_OMP_ID="$(otool -D "$OMP_DYLIB" | tail -n 1 | xargs)"
          echo "Looking for LC_LOAD_DYLIB references to: ${HOMEBREW_OMP_ID}"

          # @loader_path from library/PKG/libs/FOO.so goes up 3 dirs to
          # R.framework/Resources, then into /lib to find libomp.dylib.
          RPATH="@loader_path/../../../lib"

          patched=0
          while IFS= read -r so; do
            if otool -L "$so" 2>/dev/null | grep -q "${HOMEBREW_OMP_ID}"; then
              echo "Patching ${so}"
              chmod u+w "$so"
              install_name_tool -change "${HOMEBREW_OMP_ID}" "@rpath/libomp.dylib" "$so"
              # Adding a duplicate rpath is a non-fatal error — ignore.
              install_name_tool -add_rpath "$RPATH" "$so" 2>/dev/null || true
              patched=$((patched + 1))
            fi
          done < <(find "$R_LIB" -name "*.so" -type f)

          echo "Patched ${patched} .so file(s)."
          if [ "$patched" -gt 0 ]; then
            echo "Verification — one patched .so:"
            find "$R_LIB" -name "QUBIC.so" -exec otool -L {} \; 2>/dev/null || \
              find "$R_LIB" -name "runibic.so" -exec otool -L {} \; 2>/dev/null || true
          fi

      # CRAN bakes /Library/Frameworks paths into every Mach-O, and dyld tries
      # those BEFORE any fallback, so without this the app loads the host's
      # libR whenever a user has R installed. Runs here because it must come
      # after the package library exists - CRAN's package binaries carry the
      # same absolute reference. See documentation/notes/rscript-rhome-relocation.md
      - name: Sever host-framework references
        run: |
          set -euo pipefail
          bash electron/scripts/relocate_install_names_mac.sh \
            "$PACKAGE_DIR/runtime/R.framework/Resources"

          # Same sweep the packaged app gets, run here so a dangling host
          # dependency fails with the staging tree still on disk - "Reclaim
          # staging space" rm -rf's it before the authoritative run. Nothing
          # between the two points can introduce a dependency: prune deletes
          # docs, strip -x drops local symbols, neither touches LC_LOAD_DYLIB.
          bash electron/scripts/verify_no_host_deps_mac.sh "$PACKAGE_DIR/runtime"

      # Pre-flight test: exercise the bundled runtime the same way
      # bootstrap.R will at app launch, but without starting the shiny
      # server.  Catches install-time failures (missing deps, namespace
      # load errors, broken run_app()) in CI instead of on the user's Mac.
      - name: Test bundled R runtime
        run: |
          set -euo pipefail
          R_RES="$(cd "$PACKAGE_DIR/runtime/R.framework/Resources" && pwd -P)"
          rscript="$R_RES/bin/Rscript"
          lib="$R_RES/library"

          # Mirror main.js getRuntime(); without RHOME this runs the runner's
          # own R and passes while the shipped app is broken.
          export RHOME="$R_RES"
          export R_HOME="$R_RES"
          export DYLD_FALLBACK_LIBRARY_PATH="$R_RES/lib"
          export R_LIBS_USER="$lib"
          export R_LIBS=""

          cat > runtime_test.R << 'EOF'
          args <- commandArgs(trailingOnly = TRUE)
          lib <- args[1]
          app_pkg <- args[2]
          .libPaths(c(lib, .libPaths()))
          cat("[test] .libPaths() =", paste(.libPaths(), collapse = " | "), "\n")

          # Fail if we ended up in the runner's R rather than the bundled one.
          expected <- normalizePath(dirname(lib), mustWork = TRUE)
          actual   <- normalizePath(R.home(),     mustWork = TRUE)
          cat("[test] R.home() =", actual, "\n")
          if (!identical(actual, expected)) {
            stop("[test] FAIL: ran the wrong R. expected ", expected, " got ", actual)
          }
          cat("[test] OK: running the bundled R\n")
          cat("[test] app package =", app_pkg, "\n")

          required <- c(app_pkg, "shiny",
                        "DESeq2", "ComplexHeatmap", "WGCNA",
                        "QUBIC", "runibic")
          for (pkg in required) {
            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop("[test] FAIL: package '", pkg, "' not loadable")
            }
            cat("[test] OK: requireNamespace(", pkg, ")\n", sep = "")
          }

          run_app <- getExportedValue(app_pkg, "run_app")
          app <- run_app()
          if (!inherits(app, "shiny.appobj")) {
            stop("[test] FAIL: ", app_pkg, "::run_app() did not return a shiny.appobj")
          }
          cat("[test] OK: ", app_pkg, "::run_app() returned shiny.appobj\n", sep = "")
          cat("[test] PASS: bundled R runtime is healthy\n")
          EOF

          "$rscript" --vanilla runtime_test.R "$lib" "$PKG_NAME"

      - name: Show current file descriptor limits
        run: |
          set -euxo pipefail
          ulimit -n
          sysctl kern.maxfiles
          sysctl kern.maxfilesperproc

      - name: Raise macOS file descriptor limits
        run: |
          set -euxo pipefail
          sudo sysctl -w kern.maxfiles=65536
          sudo sysctl -w kern.maxfilesperproc=65536
          ulimit -n 65536

      - name: Prune R library (docs, examples, tests)
        run: |
          set -euxo pipefail
          R_LIB="$PACKAGE_DIR/runtime/R.framework/Resources/library"

          find "$R_LIB" -type d \( \
            -name help -o -name doc -o -name docs -o \
            -name html -o -name examples -o -name demo -o \
            -name tests -o -name testthat -o -name unitTests -o \
            -name vignettes \
          \) -prune -exec rm -rf {} +

          find "$R_LIB" \( -name "*.so" -o -name "*.dylib" \) -exec strip -x {} \; || true

      # Built in two phases to halve peak disk. A single `electron-builder`
      # invocation holds three copies of the ~3.5 GB R runtime at once: the
      # staged runtime/, the packaged copy inside iDEP.app, and the temporary
      # volume that dmgbuild mounts and dittos into. That peaks near 12 GB on a
      # runner with about 14 GB free, which is what produced
      # "No space left on device" during dmgbuild.
      #
      # Phase 1 packages and signs the .app. The staged runtime/ and app/ are
      # then redundant - their contents live inside the .app - so removing them
      # frees roughly 3.5 GB before phase 2 mounts the DMG volume.
      - name: Build phase 1 (package and sign the .app)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euxo pipefail
          ulimit -n 65536
          df -h /
          npx electron-builder --mac --dir --publish=never
          df -h /

      - name: Reclaim staging space before building the DMG
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -uo pipefail
          echo "--- staging sizes ---"
          du -sh runtime app 2>/dev/null || true
          APP_PATH="$(ls -d dist/mac*/*.app | head -n1)"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No packaged .app found; refusing to delete staging."
            exit 1
          fi
          # Only safe because the packaged .app already contains this content.
          rm -rf runtime app
          echo "--- after reclaim ---"
          df -h /
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # dmg.size must be set explicitly. electron-builder delegates to Python
      # dmgbuild, which creates a FIXED-SIZE HFS+ image before copying anything
      # and sizes it as 128 MiB + the sum of file sizes rounded up to 4 KiB.
      # That sum counts files only: directory catalog records, the catalog and
      # attribute B-trees, and the allocation bitmap all cost real bytes and are
      # not modelled. An R library with 355 packages has enough entries for that
      # shortfall to exceed the margin, which is why upstream documents this
      # option as the remedy for "No space left on device" specifically.
      #
      # Oversizing is free in the shipped artifact: shrinkOnWrite defaults to
      # true, so the filesystem is shrunk to its minimum before compression. It
      # costs only transient host space, which the reclaim step above just
      # freed. Size takes hdiutil syntax, hence the "m" suffix.
      - name: Build phase 2 (DMG from the prepackaged app)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euxo pipefail
          ulimit -n 65536
          APP_MB=$(du -sm "$APP_PATH" | cut -f1)
          DMG_MB=$(( APP_MB * 5 / 4 + 512 ))
          echo "app=${APP_MB}M requesting dmg image=${DMG_MB}M"
          df -h /
          npx electron-builder --mac dmg --prepackaged "$APP_PATH" \
            -c.dmg.size="${DMG_MB}m" --publish=never
          df -h /
          ls -lh dist/*.dmg

      # Verify the signature locally BEFORE notarizing. Notarization is a slow
      # round trip, so catching an unsigned nested binary here saves a long
      # wait. Note this is not sufficient on its own — a bundle can pass local
      # verification and still be rejected by the notary service, so we still
      # read the notarytool log below.
      - name: Verify code signature
        run: |
          set -euo pipefail
          APP=$(ls -d "$PACKAGE_DIR"/dist/mac*/*.app | head -n1)
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          # Spot-check nested R binaries — these are the ones an over-broad
          # signIgnore would silently leave unsigned.
          #
          # Do NOT write this as `find ... | head -20 | while read`. Under
          # `set -o pipefail`, head exits after 20 lines, find takes SIGPIPE on
          # its next write and returns 141, and the pipeline fails the step even
          # when every binary is correctly signed. Reading from a process
          # substitution instead keeps find's exit status out of the pipeline
          # and keeps the loop in this shell, so the counters survive it.
          echo "--- sampling nested R .so files ---"
          checked=0
          unsigned=0
          while IFS= read -r f; do
            if codesign --verify --strict "$f" 2>/dev/null; then
              echo "  signed:   ${f##*/library/}"
            else
              echo "  UNSIGNED: ${f##*/library/}"
              unsigned=$((unsigned + 1))
            fi
            checked=$((checked + 1))
            [ "$checked" -lt 20 ] || break
          done < <(find "$APP" -name "*.so" -type f)
          if [ "$unsigned" -gt 0 ]; then
            echo "::error::${unsigned} of ${checked} sampled .so files are unsigned."
            exit 1
          fi
          echo "Checked ${checked} nested .so files; all signed."

          # The only check downstream of the prune and strip steps, and the
          # only one that sees the packaged 355-package library.
          echo "--- host dependency sweep ---"
          bash "$GITHUB_WORKSPACE/electron/scripts/verify_no_host_deps_mac.sh" \
            "$APP/Contents/Resources/runtime"

          # bin/exec/R must carry allow-dyld-environment-variables or it starts
          # with DYLD_FALLBACK_LIBRARY_PATH stripped and cannot find libR.dylib
          # on a Mac with no system R.
          #
          # This asserts the entitlement is PRESENT. It cannot prove it works:
          # this runner has R at the baked-in path, so libR always resolves
          # here no matter what. The end-to-end proof lives in the
          # smoke-test-mac-runtime workflow, which hides the system R and runs
          # the signed bundle in ~10 minutes. Run that before tagging.
          # See documentation/notes/rscript-rhome-relocation.md
          echo "--- entitlements on bin/exec/R ---"
          EXEC_R="$APP/Contents/Resources/runtime/R.framework/Resources/bin/exec/R"
          if [ ! -f "$EXEC_R" ]; then
            echo "::error::bin/exec/R not found at $EXEC_R"
            exit 1
          fi
          ents="$(codesign -d --entitlements - --xml "$EXEC_R" 2>&1 || true)"
          echo "$ents"
          if printf '%s' "$ents" | grep -q "allow-dyld-environment-variables"; then
            echo "OK: bin/exec/R carries allow-dyld-environment-variables."
          else
            echo "::error::bin/exec/R is MISSING allow-dyld-environment-variables."
            echo "::error::It will launch with DYLD_* stripped and fail to load libR.dylib"
            echo "::error::on any Mac without a system R install."
            exit 1
          fi

      - name: Notarize and staple DMG
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # NOTE: deliberately `set -euo pipefail`, never `-x`. Tracing would
        # print the App Store Connect private key into the build log.
        run: |
          set -euo pipefail
          DMG_PATH=$(ls dist/*.dmg | head -n1)
          echo "Notarizing $DMG_PATH ($(du -h "$DMG_PATH" | cut -f1))"

          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY" > "$KEY_FILE"
          cleanup() { rm -f "$KEY_FILE"; }
          trap cleanup EXIT

          # --timeout bounds the wait. GitHub caps a job at 6h and the R build
          # already spends ~1h, so we cannot block indefinitely. Hitting the
          # timeout is NOT a rejection: the submission keeps processing on
          # Apple's side and can be resumed with
          #   xcrun notarytool wait <submission-id> --key ... --key-id ... --issuer ...
          set +e
          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 45m 2>&1 | tee notarize.log
          SUBMIT_RC=${PIPESTATUS[0]}
          set -e

          SUBMISSION_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' notarize.log | head -1 || true)
          echo "Submission ID: ${SUBMISSION_ID:-<none captured>}"

          # Two very different failures. A timeout means Apple is still working
          # and the DMG is fine; the build artifact is uploaded regardless, so
          # recovery is to fetch the verdict and staple that artifact, NOT to
          # rebuild. A rejection means Apple examined the bundle and refused it,
          # and only then is the detailed log meaningful.
          # Match on notarytool's explicit timeout message, or on the ABSENCE of
          # the final indented verdict line. Do NOT test for the bare substring
          # "status:" - while waiting, notarytool prints unindented progress
          # lines reading "Current status: In Progress", which contain it, so
          # such a test never discriminates.
          if grep -q "Timeout of" notarize.log || ! grep -qE '^[[:space:]]+status:' notarize.log; then
            echo "::warning::Notarization wait timed out. This is NOT a rejection."
            echo "::warning::Submission ID: $SUBMISSION_ID"
            echo "::warning::Apple is still processing. Do NOT rebuild."
            echo "::warning::1. Run the 'Notarization status' workflow with this ID (action: info)."
            echo "::warning::2. If Accepted, download the mac-dist artifact from this run and staple it."
            exit 1
          fi

          if [ "$SUBMIT_RC" -ne 0 ] || ! grep -q "status: Accepted" notarize.log; then
            echo "::error::Notarization was REJECTED. Fetching the detailed log."
            echo "::error::Submission ID: $SUBMISSION_ID"
            if [ -n "$SUBMISSION_ID" ]; then
              # This is the ONLY output that names the offending binaries.
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            fi
            exit 1
          fi

          # Stapling attaches the notarization ticket so Gatekeeper works offline.
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          # Final check: what a user's Mac will actually decide on first launch.
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH" || true
          echo "Notarized and stapled."

      # Runs even if notarization timed out, so an hour of build work is never
      # lost to a slow Apple queue. A timed-out submission is still processing
      # server side: retrieve the verdict with the "Notarization status"
      # workflow, then staple this artifact rather than rebuilding.
      # *.dmg only: dist/** also stored the unpacked .app (~3.5 GB of R runtime).
      # continue-on-error: a full storage quota must not discard a finished build.
      - name: Upload dist artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: ${{ env.PACKAGE_DIR }}/dist/*.dmg
          if-no-files-found: warn
          retention-days: 3


      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
